<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="description" content="SplitEase — تطبيق لحساب وتقاسم مصاريف الشل مع الميزانية الشهرية، يعمل بالكامل بدون إنترنت.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0D9488" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SplitEase">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icons/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>SplitEase — حساب الشلة</title>
</head>
<body>

<a class="skip-link" href="#mainContent">تخطَّ إلى المحتوى الرئيسي</a>

<div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
  <div class="loading-logo" aria-hidden="true">S</div>
  <div class="loading-text">SplitEase</div>
  <div class="loading-sub">حساب الشلة • تقاسم المصاريف بسهولة</div>
  <div class="loading-bar" role="presentation"><div class="loading-bar-fill"></div></div>
  <span class="is-hidden">جارٍ تحميل التطبيق</span>
</div>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo" aria-hidden="true">S</div>
      <div>
        <div class="sidebar-brand-text">SplitEase</div>
        <div class="sidebar-brand-sub">حساب الشلة</div>
      </div>
    </div>
    <nav class="sidebar-nav" aria-label="التنقل الرئيسي">
      <button class="nav-item active" data-page="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 10.4 12 3.3l8.8 7.1"/><path d="M5.4 9v9.7A2.3 2.3 0 0 0 7.7 21h8.6a2.3 2.3 0 0 0 2.3-2.3V9"/><path d="M9.8 21v-5.4a2.2 2.2 0 0 1 2.2-2.2a2.2 2.2 0 0 1 2.2 2.2V21"/></svg>
        <span data-i18n="home">الرئيسية</span>
      </button>
      <button class="nav-item" data-page="budget">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 5.8 18.4 4 5.6 4 3.8 5.8a2.2 2.2 0 0 0-.2 2.2v12a2.2 2.2 0 0 0 2.2 2.2h12.4a2.2 2.2 0 0 0 2.2-2.2V8a2.2 2.2 0 0 0-.2-2.2z"/><path d="M7.2 10.2h9.6"/><circle cx="12" cy="14.8" r="1.6"/><path d="M12 10.8v4"/></svg>
        <span data-i18n="budget">الميزانية</span>
      </button>
      <button class="nav-item" data-page="personal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.8 4.2 18.6 9a1.4 1.4 0 0 1 0 2l-4.8 4.8a1.4 1.4 0 0 1-2 0L5.4 15.8a1.4 1.4 0 0 1 0-2l4.8-4.8a1.4 1.4 0 0 1 2 0z"/><path d="M16.4 13.8l-2.6 2.6"/><path d="M7.8 10.6v7.2a1.4 1.4 0 0 0 1.4 1.4h7.2a1.4 1.4 0 0 0 1.4-1.4v-7.2"/></svg>
        <span>شخصي</span>
      </button>
      <button class="nav-item" data-page="groups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.2" cy="8.2" r="3.3"/><path d="M3.2 19.8a6 6 0 0 1 12 0"/><path d="M16.2 5.3a3.3 3.3 0 0 1 0 5.8"/><path d="M17.6 14.4a6 6 0 0 1 3.2 5.4"/></svg>
        <span data-i18n="groups">المجموعات</span>
        <span class="nav-badge" id="groupsBadge" style="display:none">0</span>
      </button>
      <button class="nav-item" data-page="cloud" hidden id="cloudNavItem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.6 18.6a4.3 4.3 0 0 1-.5-8.5 5.5 5.5 0 0 1 10.4 1.4 3.6 3.6 0 0 1-.4 7.1z"/><path d="M12 20.8v-4.4"/><path d="M9.9 18.3 12 16.2l2.1 2.1"/></svg>
        <span>الشلة السحابية</span>
      </button>
      <button class="nav-item" data-page="insights">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.2 20.4v-6.2"/><path d="M12 20.4V4.2"/><path d="M18.8 20.4v-9.6"/></svg>
        <span data-i18n="insights">التقارير</span>
      </button>
      <button class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 3.4h4.8l.5 2.1a7.6 7.6 0 0 1 1.8 1l2.1-.5 2.4 4.1-1.6 1.5a7.6 7.6 0 0 1 0 2.1l1.6 1.5-2.4 4.1-2.1-.5a7.6 7.6 0 0 1-1.8 1l-.5 2.1H9.6l-.5-2.1a7.6 7.6 0 0 1-1.8-1l-2.1.5-2.4-4.1 1.6-1.5a7.6 7.6 0 0 1 0-2.1L2.8 10l2.4-4.1 2.1.5a7.6 7.6 0 0 1 1.8-1z"/><circle cx="12" cy="12.6" r="2.9"/></svg>
        <span data-i18n="settings">الإعدادات</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item" id="themeToggle" aria-pressed="false">
        <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.6"/><path d="M12 2.4v2.3"/><path d="M12 19.3v2.3"/><path d="M2.4 12h2.3"/><path d="M19.3 12h2.3"/><path d="M5.2 5.2l1.6 1.6"/><path d="M17.2 17.2l1.6 1.6"/><path d="M18.8 5.2l-1.6 1.6"/><path d="M6.8 17.2l-1.6 1.6"/></svg>
        <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.6 8.6 0 1 0 10.8 10.8z"/></svg>
        <span id="themeLabel">الوضع النهاري</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent" tabindex="-1">
    <div id="appContent"></div>
  </main>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav" id="bottomNav" aria-label="تنقل سريع">
  <div class="bottom-nav-inner">
    <button class="bottom-nav-item active" data-page="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 10.4 12 3.3l8.8 7.1"/><path d="M5.4 9v9.7A2.3 2.3 0 0 0 7.7 21h8.6a2.3 2.3 0 0 0 2.3-2.3V9"/><path d="M9.8 21v-5.4a2.2 2.2 0 0 1 2.2-2.2a2.2 2.2 0 0 1 2.2 2.2V21"/></svg>
      <span data-i18n="home">الرئيسية</span>
    </button>
    <button class="bottom-nav-item" data-page="budget">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 5.8 18.4 4 5.6 4 3.8 5.8a2.2 2.2 0 0 0-.2 2.2v12a2.2 2.2 0 0 0 2.2 2.2h12.4a2.2 2.2 0 0 0 2.2-2.2V8a2.2 2.2 0 0 0-.2-2.2z"/><path d="M7.2 10.2h9.6"/><circle cx="12" cy="14.8" r="1.6"/><path d="M12 10.8v4"/></svg>
      <span data-i18n="budget">الميزانية</span>
    </button>
    <button class="bottom-nav-item" data-page="personal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.8 4.2 18.6 9a1.4 1.4 0 0 1 0 2l-4.8 4.8a1.4 1.4 0 0 1-2 0L5.4 15.8a1.4 1.4 0 0 1 0-2l4.8-4.8a1.4 1.4 0 0 1 2 0z"/><path d="M16.4 13.8l-2.6 2.6"/><path d="M7.8 10.6v7.2a1.4 1.4 0 0 0 1.4 1.4h7.2a1.4 1.4 0 0 0 1.4-1.4v-7.2"/></svg>
      <span>شخصي</span>
    </button>
    <button class="bottom-nav-item" data-page="groups">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.2" cy="8.2" r="3.3"/><path d="M3.2 19.8a6 6 0 0 1 12 0"/><path d="M16.2 5.3a3.3 3.3 0 0 1 0 5.8"/><path d="M17.6 14.4a6 6 0 0 1 3.2 5.4"/></svg>
      <span data-i18n="groups">المجموعات</span>
    </button>
    <button class="bottom-nav-item" data-page="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 3.4h4.8l.5 2.1a7.6 7.6 0 0 1 1.8 1l2.1-.5 2.4 4.1-1.6 1.5a7.6 7.6 0 0 1 0 2.1l1.6 1.5-2.4 4.1-2.1-.5a7.6 7.6 0 0 1-1.8 1l-.5 2.1H9.6l-.5-2.1a7.6 7.6 0 0 1-1.8-1l-2.1.5-2.4-4.1 1.6-1.5a7.6 7.6 0 0 1 0-2.1L2.8 10l2.4-4.1 2.1.5a7.6 7.6 0 0 1 1.8-1z"/><circle cx="12" cy="12.6" r="2.9"/></svg>
      <span data-i18n="settings">الإعدادات</span>
    </button>
  </div>
</nav>

<!-- FAB -->
<button class="fab" id="fab" aria-label="إضافة مصروف" aria-haspopup="dialog" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5.6v12.8"/><path d="M5.6 12h12.8"/></svg>
</button>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
    <div class="modal-header">
      <h2 id="modalTitle">عنوان</h2>
      <button class="modal-close" id="modalClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6.8 6.8 17.2 17.2"/><path d="M17.2 6.8 6.8 17.2"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer" role="status" aria-live="polite" aria-atomic="false"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<!-- Optional per-machine override; 404s harmlessly when absent. -->
<script src="js/supabase-config.local.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
<script src="js/cloud-ui.js"></script>
<!-- Contextual Help System -->
<script src="js/contextual-help.js"></script>
<!-- Help Buddy - Animated 2D Character -->
<script src="js/help-buddy.js"></script>
<!-- Last: the tour reads t() from app.js and toast() from the same file. -->
<script src="js/onboarding.js"></script>
</body>
</html>
