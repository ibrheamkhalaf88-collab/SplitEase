name: CI & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (no deps expected)
        run: |
          # project has no package dependencies, but ensure node works
          node --version
          npm --version

      - name: Run tests
        run: node --test
        working-directory: ./SplitEase

      - name: Lint JS syntax
        run: |
          for f in SplitEase/js/*.js SplitEase/sw.js SplitEase/scripts/*.mjs; do
            node --check "$f" || exit 1
          done

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./SplitEase

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4