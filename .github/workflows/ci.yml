name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run tests
        run: node --test
        working-directory: ./SplitEase

      - name: Lint JS syntax
        run: |
          for f in SplitEase/js/*.js SplitEase/sw.js SplitEase/scripts/*.mjs; do
            node --check "$f" || exit 1
          done