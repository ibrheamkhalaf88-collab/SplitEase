<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Generate PWA Icons</title></head>
<body>
<canvas id="c" width="512" height="512" style="display:none"></canvas>
<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
const c = document.getElementById('c');
const ctx = c.getContext('2d');

function drawIcon(size) {
  c.width = size; c.height = size;
  const r = size * 0.18;
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#0D9488'); grad.addColorStop(1, '#14B8A6');
  ctx.beginPath(); ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0); ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r); ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size); ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  ctx.fillStyle = 'white'; ctx.font = `bold ${size * 0.5}px system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('S', size * 0.5, size * 0.52);

  const badgeR = size * 0.13;
  ctx.beginPath(); ctx.arc(size * 0.82, size * 0.25, badgeR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#F97066';
  ctx.beginPath(); ctx.arc(size * 0.82, size * 0.25, badgeR * 0.85, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'white'; ctx.font = `bold ${size * 0.14}px system-ui,sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.fillText('$', size * 0.82, size * 0.255);
}

sizes.forEach(s => {
  drawIcon(s);
  const link = document.createElement('a');
  link.download = `icon-${s}.png`;
  link.href = c.toDataURL('image/png');
  link.click();
});
document.body.innerHTML = '<h2>تم توليد الأيقونات</h2><p>تم تحميل جميع الأيقونات. ضعها في مجلد icons/</p>';
</script>
</body>
</html>
