# Supabase local config — required by `supabase db push` / `supabase link`.
# Only the fields the CLI needs; everything else uses defaults.

project_id = "splitease"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
# The client generates its own shareable codes, so nothing is sent by email.
enable_signup = true
